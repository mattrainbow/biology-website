<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page_title}}</title>
<meta name="description" content="{{description}}">
<meta name="theme-color" content="#ffffff">
<meta property="og:site_name" content="{{site_title}}">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{{url}}">
<link rel="icon" href="{{root}}assets/img/icon.svg" type="image/svg+xml">
<script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
<link rel="stylesheet" href="{{asset:assets/css/tokens.css}}">
<link rel="stylesheet" href="{{asset:assets/css/site.css}}">
{{head}}</head>
<body class="{{page}}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-head"><div class="wrap">
  <a class="brand" href="{{root}}" aria-label="{{site_title}}, home"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M3 24a13 13 0 0 1 26 0"/><path d="M9.5 24a6.5 6.5 0 0 1 13 0"/></svg><span>{{site_title}}</span></a>
  <button class="theme" type="button" aria-label="Switch color mode"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.5 1.5M17.2 17.2l1.5 1.5M18.7 5.3l-1.5 1.5M6.8 17.2l-1.5 1.5"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.3A8.3 8.3 0 0 1 9.7 4 8.3 8.3 0 1 0 20 14.3z"/></svg></button>
</div></header>
<main id="main">
{{main}}
</main>
<footer class="site-foot"><div class="wrap">{{site_title}}</div></footer>
<script src="{{asset:assets/js/site.js}}" defer></script>
{{scripts}}</body>
</html>
